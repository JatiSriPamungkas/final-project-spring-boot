spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fp_spring_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis

server:
  port: ${PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

app:
  api-key: ${API_KEY:final-project-api-key-2026}
  dummy-json:
    url: ${DUMMY_JSON_URL:https://dummyjson.com/products}
  scheduler:
    dummy-json:
      enabled: ${SCHEDULER_ENABLED:true}
      cron: ${SCHEDULER_CRON:0 */5 * * * *} # Default: setiap 5 menit (contoh testing cepat: "*/10 * * * * *" untuk tiap 10 detik)
      limit: ${SCHEDULER_LIMIT:5}           # Default: 5 data per batch (dapat disesuaikan)
      url: ${DUMMY_JSON_URL:https://dummyjson.com/products}
