services:
  postgres:
    image: postgres:16-alpine
    container_name: fp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fp_spring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fp_spring_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fp-network

  redis:
    image: redis:alpine
    container_name: fp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fp-network

volumes:
  postgres_data:
    name: fp_postgres_data
  redis_data:
    name: fp_redis_data

networks:
  fp-network:
    driver: bridge
